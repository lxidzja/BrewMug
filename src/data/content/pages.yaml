# Тексти сторінок "Про нас" і "Контакти".
# Усе, що позначено placeholder: true, — вигадане для макета й потребує підтвердження власника.

about:
  title: Кавʼярня, яку ми хотіли б мати поруч
  lead: >-
    Усе почалося з однієї обсмажувальної машини у дворі на Подолі. Зараз — свіжа випічка, власна
    обсмажка й зал, де можна спокійно попрацювати.
  facts:
    - num: "1"
      title: Наше зерно
      text: >-
        Купуємо зелене зерно у фермерів і обсмажуємо малими партіями. Тому на пачці завжди стоїть
        дата обсмажки, а не лише «термін придатності».
    - num: "2"
      title: Наша кухня
      text: >-
        Усе на вітрині — наше: медівник, сирники, тарти, брауні. Без напівфабрикатів і без
        «розігріти в мікрохвильовці».
    - num: "3"
      title: Наш зал
      text: >-
        Довгі столи з розетками, тиха зона без гучної музики. Ми не ждемося гостей із ноутбуком і
        не рахуємо, скільки ви сидите.
  # 📋 ЦИФРИ НИЖЧЕ — ЗАГЛУШКИ. Публікувати лише підтверджені значення.
  stats:
    - value: "12 кг"
      label: обсмажуємо за раз
      placeholder: true
    - value: "42"
      label: місця в залі
      placeholder: true
    - value: "7 років"
      label: на Подолі
      placeholder: true
  team:
    - name: Олена
      role: шеф-бариста
      text: Памʼятає ваше замовлення з третього візиту й любить питання про зерно.
      illo: flat
      placeholder: true
    - name: Тарас
      role: обсмажувальник
      text: Веде журнал обсмажки й вирішує, коли зерно готове.
      illo: filter
      placeholder: true
    - name: Ірина
      role: кондитерка
      text: Пече медівник за родинним рецептом і приходить до відкриття.
      illo: honeycake
      placeholder: true

contacts:
  lead: Три хвилини пішки від метро. Пишіть або телефонуйте — відповідаємо швидко.
  routeLabel: Прокласти маршрут
  formTitle: Напишіть нам
  formLead: Замовлення на свято, скарга, співпраця або просто запитання — відповідаємо протягом дня.